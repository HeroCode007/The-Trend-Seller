  <style>
    * {

    body {

      align-items: center;
      justify-content: center;

    .header-bar {

    }

    /* 9:16 Vertical Phone Shell */
    .phone-container {

      height: 680px;
      background: #000;

      border: 3px solid rgba(212, 175, 55, 0.5);

      display: flex;

    }

    /* Actual Rendered MP4 Video */
    .avatar-video {

    /* Top Social Header Overlay */
    .top-overlay {

      left: 16px;
      right: 16px;

      align-items: center;
      z-index: 10;

    .brand-badge {

      border: 1px solid rgba(212, 175, 55, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #fef08a;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .badge-deal {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.6);
    }

    /* Bottom Overlay Card */
    .bottom-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0.95) 100%);
      z-index: 10;
    }

    .deal-info-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }

    .deal-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 800;
      color: #fef08a;
      margin-bottom: 2px;
    }

    .deal-sub {
      font-size: 10px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .deal-pricing {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;

    .price-strike {
      font-size: 11px;
      color: #ef4444;
      text-decoration: line-through;
    }

    .price-active {

      font-weight: 900;
      color: #4ade80;
    }

    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(90deg, #d4af37 0%, #fef08a 50%, #d4af37 100%);

      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      transition: transform 0.2s ease;
    }

    .cta-button:hover {

    /* Controls Bar */

      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: #d4af37;
