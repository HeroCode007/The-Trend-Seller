<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trend Seller - AI Avatar Video Ad Player (UGC-001)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header-bar {
      text-align: center;
      margin-bottom: 16px;
    }

    .header-bar h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      color: #d4af37;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-bar p {
      font-size: 13px;
      color: #94a3b8;
    }

    /* 9:16 Vertical Video Player Container */
    .video-mockup {
      position: relative;
      width: 380px;
      height: 675px;
      background: #000;
      border-radius: 28px;
      border: 2px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .background-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform 10s ease;
    }

    .video-mockup.playing .background-poster {
      transform: scale(1.06);
    }

    /* Overlay Gradient for readability */
    .dark-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0.95) 100%);
      pointer-events: none;
    }

    /* Top Social Bar */
    .top-social-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-pill {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: #f1e4b8;
      letter-spacing: 1px;
    }

    .brand-logo-dot {
      width: 10px;
      height: 10px;
      background: #d4af37;
      border-radius: 50%;
      box-shadow: 0 0 8px #d4af37;
    }

    .sponsored-tag {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 1px;
    }

    /* Dynamic Captions Box (MrBeast / Hormozi Style) */
    .caption-box {
      position: absolute;
      bottom: 110px;
      left: 16px;
      right: 16px;
      text-align: center;
      z-index: 20;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dynamic-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 3px 0 #000, 0 0 15px rgba(0,0,0,0.9), 0 0 25px rgba(250, 204, 21, 0.6);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid rgba(250, 204, 21, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: popCaption 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .highlight-word {
      color: #fde047;
      background: rgba(234, 179, 8, 0.25);
      padding: 2px 6px;
      border-radius: 6px;
      text-shadow: 0 0 10px #fde047;
    }

    @keyframes popCaption {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Bottom Action Area */
    .bottom-cta-area {
      position: relative;
      z-index: 20;
      padding: 0 16px 18px;
      width: 100%;
    }

    .cta-button {
      width: 100%;
      background: linear-gradient(90deg, #d4af37 0%, #fef08a 50%, #d4af37 100%);
      background-size: 200% auto;
      color: #000;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
      animation: pulseCta 2s infinite ease-in-out;
      text-decoration: none;
    }

    @keyframes pulseCta {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Play / Pause Floating Overlay */
    .play-trigger-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 30;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .play-btn-circle {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #d4af37, #b48c18);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.8);
      margin-bottom: 12px;
      transition: transform 0.2s ease;
    }

    .play-btn-circle:hover {
      transform: scale(1.1);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #000;
      margin-left: 4px;
    }

    .play-prompt-text {
      font-size: 14px;
      font-weight: 800;
      color: #f1e4b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Progress bar */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 40;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #d4af37;
      box-shadow: 0 0 8px #d4af37;
      transition: width 0.1s linear;
    }

    /* Control Controls below player */
    .player-controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f1e4b8;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: #d4af37;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Trend Seller AI Avatar Preview</h1>
    <p>Ad UGC-001: Grand Couple Combo (Saif Avatar Presenter)</p>
  </div>

  <div class="video-mockup" id="videoBox">
    <!-- Top Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- Background Commercial Poster -->
    <img class="background-poster" id="adImage" src="assets/saif-couple-combo-ad-poster.jpg" alt="Saif Couple Combo Ad">
    <div class="dark-overlay"></div>

    <!-- Top Bar -->
    <div class="top-social-bar">
      <div class="brand-pill">
        <div class="brand-logo-dot"></div>
        THE TREND SELLER
      </div>
      <div class="sponsored-tag">SPECIAL DROP</div>
    </div>

    <!-- Dynamic Animated Captions -->
    <div class="caption-box">
      <div class="dynamic-text" id="captionText">
        TAP PLAY TO HEAR SAIF'S AI SCRIPT 🔊
      </div>
    </div>

    <!-- Bottom Action CTA -->
    <div class="bottom-cta-area">
      <a href="https://wa.me/923130205251?text=Hi%2C%20I%20want%20to%20order%20the%20Grand%20Couple%20Combo%20Deal%20for%20Rs.%206850" target="_blank" class="cta-button">
        <span>📲 ORDER ON WHATSAPP: 0313-0205251</span>
      </a>
    </div>

    <!-- Play Trigger Overlay -->
    <div class="play-trigger-overlay" id="playOverlay">
      <div class="play-btn-circle">
        <div class="play-icon"></div>
      </div>
      <div class="play-prompt-text">Click to Play Video Ad (24s)</div>
    </div>
  </div>

  <div class="player-controls">
    <button class="control-btn" id="restartBtn">🔄 Replay from Start</button>
    <button class="control-btn" id="muteBtn">🔊 Audio: Voiceover ON</button>
  </div>

  <script>
    const beats = [
      {
        start: 0,
        end: 4,
        text: 'Agar aap apne partner ke liye aik <span class="highlight-word">MEMORABLE LUXURY GIFT</span> dhoond rahe hain...',
        spoken: 'Agar aap apne partner ya kisi special person ke liye aik memorable luxury gift dhoond rahe hain, to aglay 15 seconds miss mat karna!'
      },
      {
        start: 4,
        end: 11,
        text: 'The Trend Seller pe launch ho chuka hai <span class="highlight-word">GRAND COUPLE COMBO</span>! Datejust + OLIYA Diamond Edition!',
        spoken: 'The Trend Seller pe hum launch kar rahe hain apna Grand His and Hers Couple Combo! Mens ke liye royal blue Datejust aur ladies ke liye OLIYA Diamond Emerald-Cut!'
      },
      {
        start: 11,
        end: 18,
        text: 'Dono watches sirf <span class="highlight-word">Rs. 6,850</span> me! With 100% <span class="highlight-word">OPEN PARCEL CHECK</span> on Delivery!',
        spoken: 'Lekin is limited combo deal me aapko yeh dono watches milengi sirf 6,850 rupees me! Cash on Delivery all over Pakistan, aur 100% open parcel check policy!'
      },
      {
        start: 18,
        end: 24,
        text: 'Limited stock available! Neechay link pe tap karein ya <span class="highlight-word">WHATSAPP: 0313-0205251</span>!',
        spoken: 'Stock bohot limited hai. Neechay link pe tap karein ya abhi WhatsApp karein 0313-0205251 pe to claim your combo deal today!'
      }
    ];

    const totalDuration = 24;
    let isPlaying = false;
    let currentTime = 0;
    let timerInterval = null;
    let isMuted = false;

    const videoBox = document.getElementById('videoBox');
    const playOverlay = document.getElementById('playOverlay');
    const captionText = document.getElementById('captionText');
    const progressFill = document.getElementById('progressFill');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');

    function speakText(text) {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function updateFrame() {
      currentTime += 0.2;
      const progressPercent = Math.min((currentTime / totalDuration) * 100, 100);
      progressFill.style.width = progressPercent + '%';

      // Find active beat
      const activeBeat = beats.find(b => currentTime >= b.start && currentTime < b.end);
      if (activeBeat) {
        if (captionText.innerHTML !== activeBeat.text) {
          captionText.innerHTML = activeBeat.text;
          // Speak when entering beat
          if (currentTime - activeBeat.start < 0.3) {
            speakText(activeBeat.spoken);
          }
        }
      }

      if (currentTime >= totalDuration) {
        pauseAd();
        currentTime = 0;
        captionText.innerHTML = '✨ CLICK REPLAY TO WATCH AGAIN ✨';
      }
    }

    function playAd() {
      isPlaying = true;
      videoBox.classList.add('playing');
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';

      clearInterval(timerInterval);
      timerInterval = setInterval(updateFrame, 200);

      // Trigger first beat speech
      speakText(beats[0].spoken);
      captionText.innerHTML = beats[0].text;
    }

    function pauseAd() {
      isPlaying = false;
      videoBox.classList.remove('playing');
      clearInterval(timerInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      playOverlay.style.opacity = '1';
      playOverlay.style.pointerEvents = 'auto';
    }

    playOverlay.addEventListener('click', playAd);

    restartBtn.addEventListener('click', () => {
      currentTime = 0;
      progressFill.style.width = '0%';
      playAd();
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.innerHTML = isMuted ? '🔇 Audio: Voiceover MUTED' : '🔊 Audio: Voiceover ON';
      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });
  </script>
</body>
</html>
